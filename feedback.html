<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Love Yoga. Platform for yoga at home, anytime. Tailored yoga for back pain and stress">
    <meta name="keywords" content="love yoga, relaxing, remote working, stressed, painful back, exercise">
    <title>Yoga Calm - feedback </title>
    <!--Fav icons from Code Insitute used on Love Running walkthrough project used for the purposes of this project. -->
    <!--Will be properly referenced in the read me file. -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <!--style sheet-->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!--header-->
    <header>
        <a id="logo" href="index.html"><img src="assets/images/Logo_small.png" height="66" width="166" alt="Yoga Calm Logo" aria-label="Yoga calm logo - takes to home page "></a>        
        <input type="checkbox" id="nav-toggle" name="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars fontawesome-icon-color"></i></label>
        <nav>
            <ul id="navmenu">
                <li><a href="index.html" aria-label="loads the home page">Home</a></li>
                <li><a class="active-page" href="startyoga.html" aria-label="loads the start yoga page"> Start Yoga</a> </li>               
                <li><a href="feedback.html" aria-label="loads the feedback page"> Win!</a></li>
            </ul>
        </nav>
    </header>
    <!--main body-->
    <main id="feedback-yoga-background">
        <section id="feedbackform">
            <form id="feedback-form" action="https://formdump.codeinstitute.net" method="post">
                <h1>Feedback.</h1>
                <p>Please fill in below to recieve a free Yoga Mat!*</p>
                <label class="feedback-form" for="input-name">Name:</label><br>
                <input id="input-name" type="text" name="full-name" class="text-input" required><br>                
                <label class="feedback-form" for="input-email"> Email: </label><br>
                <input id="input-email" type="email" name="email-address" class="text-input" required>
                <br>
                <label class="feedback-form" for="age">Age:</label><br>
                <select id="age" name="age"  class="text-input">
                    <option value="">Select</option>
                    <option value="under-20">Under 20</option>
                    <option value="20s">20-29</option>
                    <option value="30s">30-39</option>
                    <option value="40s">40-49</option>
                    <option value="50s">50-59</option>
                    <option value="60+">60+</option>
                    <option value="not say">N/A</option>
                </select>
                <br>
                <div class="radio-buttons">
                <p>How many days a week do you work from home?</p>
                <label class="feedback-form" for="one-day">1</label>
                <input type="radio" name="days-wfh" id="one-day" value="1" required>

                <label class="feedback-form" for="two-to-three-day">2 to 3</label>
                <input type="radio" name="days-wfh" id="two-to-three-day" value="2 to 3" required>

                <label class="feedback-form" for="everyday">5</label>
                <input type="radio" name="days-wfh" id="everyday" value="everyday" required>

                <label class="feedback-form" for="not-often">Not often</label>
                <input type="radio" id="not-often" name="days-wfh" value="not-often" required>
                 </div>
                <br>
                <label class="feedback-form" for="feedback">How can we improve?</label>                
                <textarea id="feedback" rows="6" cols="45" name="feedback" class=""></textarea>
                <br>                                     
                    <input type="checkbox" id="join-mail" name="mailinglist" value="join">
                <label class="feedback-form" for="join-mail">Join our mailing list for the latests offers!</label>  
                    <br>
                    <input id="submit-style" type="submit" value="Enter" aria-label="Submits the filled in information.">
                    <input id="reset-style" type="reset" value="Reset" aria-label="Resets the filled in information.">
                    <p>*1 mat per registered user</p>
         </form>           
        </section>
        
    </main>

    <!--footer-->
    <footer>
        <ul id="socials">
            <li><a href="https://Facebook.com" target="_blank" rel="noopener"
                    aria-label="new tab - visit us on facebook"><i class="fa-brands fa-facebook fontawesome-icon-color"></i></a></li>
            <li><a href="https://www.instagram.com" target="_blank" rel="noopener"
                    aria-label="new tab - visit us on instagram"><i class="fa-brands fa-square-instagram fontawesome-icon-color"></i></a></li>
            <li><a href="https://x.com/?lang=en" target="_blank" rel="noopener" aria-label="new tab - visit us on X"><i
                        class="fa-brands fa-square-x-twitter fontawesome-icon-color"></i></a></li>
            <li><a href="https://www.youtube.com/" target="_blank" rel="noopener"
                    aria-label="new tab - visit us on youtube"><i class="fa-brands fa-youtube fontawesome-icon-color"></i></a></li>
        </ul>
    </footer>
    <!-- font awesome import-->
    <script src="https://kit.fontawesome.com/5d6f06bc3f.js" crossorigin="anonymous"></script>
</body>

</html>
